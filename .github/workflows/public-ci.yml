name: Public Windows Python 3.14

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-reproducibility:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Create isolated environment
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Confirm isolated interpreter
        run: python -c "import sys; assert sys.prefix != sys.base_prefix; print(sys.version)"
      - name: Install pinned public dependencies
        run: python -m pip install -r mcp/INSTALL_FREEZE.txt -r tests/requirements.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Prepare inherited user-site directory prerequisite
        run: python -I -c "import site, sys, jsonschema; from pathlib import Path; assert Path(jsonschema.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); p = Path(site.getusersitepackages()); p.mkdir(parents=True, exist_ok=True); print(p)"
      - name: Verify public source integrity
        run: python -B tools/verify_public_tree.py
      - name: Import runtime, MCP and local-model client
        run: python -B -c "import pg_i7_mcp.server; from runtime.candidate import i7_api; from agent_clients import llama_cpp_mcp_agent; print('IMPORTS_OK')"
      - name: CLI, relocated client and manifest rejection tests
        run: |
          python -B runtime/candidate/pg_i7.py --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m pytest -p no:cacheprovider -q tests/test_llama_cpp_mcp_agent.py tests/test_public_tree_verifier.py
      - name: Synthetic CLI demo
        run: python -B runtime/candidate/pg_i7.py demo --workspace-dir ci-demo --data-digest --causal-data --provenance --provenance-mode prospective --json
      - name: Python API and synthetic pipeline
        run: python -B examples/api_synthetic_pipeline.py
      - name: MCP stdio public demonstration and safety checks
        run: python -B tests/smoke_stdio.py
      - name: Run reference boundaries
        run: python -B tests/test_run_ref_boundaries.py
      - name: Private policy and formal fixture refusals
        run: python -B tests/test_public_boundaries.py
      - name: Selected I0 I1 I2 synthetic core tests
        env:
          PYTHONPATH: src
        run: python -B -m pytest -p no:cacheprovider --basetemp "C:\pg-tests-${{ github.run_id }}-${{ github.run_attempt }}" --junitxml=public-core-results.xml -q tests/unit
      - name: Confirm tests did not modify tracked source
        run: git diff --exit-code
